# Works an established researcher would expect this guide to know.
# scripts/check-canon.mjs checks that every `cited` entry is linked somewhere in the
# guide (chapters, notes, claims, figures, debates or reading list) and that every
# `excluded` entry says why.
#
# How entries get here (see research/MONTHLY_UPDATE.md › Canon and recall):
# popularity signals find candidates; research judgement decides.
#   signals: citations (Semantic Scholar), best-paper and outstanding-paper awards
#            (NeurIPS, ICML, ICLR, ACL), Hacker News discussion of papers and lab research
#            posts, and the field's annual reviews (Stanford AI Index, State of AI Report)
#   filter:  primary source; peer-reviewed, replicated or widely built upon; famous
#            critiques kept next to famous results; hype, marketing and debunked work out
#
# status: cited | excluded

