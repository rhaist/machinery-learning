name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Claims freshness and integrity
        run: node scripts/check-claims.mjs --strict
      - name: Design rules (DESIGN.md)
        run: node scripts/check-design.mjs
      - run: npm run build
      - name: Guard protected paths
        if: startsWith(github.head_ref, 'update/')
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^(\.claude/|\.github/|astro\.config\.mjs|package(-lock)?\.json|scripts/|research/MONTHLY_UPDATE\.md)'; then
            echo "Monthly update PRs must not change protected paths." && exit 1
          fi
