name: Check

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Claims freshness and integrity
        run: node scripts/check-claims.mjs --strict
      - name: Design rules (DESIGN.md)
        run: node scripts/check-design.mjs
      - run: npm run build
      - name: Guard protected paths in monthly update PRs
        if: startsWith(github.head_ref, 'update/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -E '^(\.claude/|\.github/|astro\.config\.mjs|package(-lock)?\.json|\.nvmrc|scripts/|research/MONTHLY_UPDATE\.md|DESIGN\.md)'; then
            echo "Monthly update PRs must not change protected paths." && exit 1
          fi
