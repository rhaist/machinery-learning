# Public corrections log, newest first. Shown on /corrections/.
# Add an entry for every factual change: wrong numbers, dates, names, attributions or overstated claims.
# Rewording, style and new content don't belong here.
# found_by: reader | fact-check | monthly review | editor
corrections:
  - date: 2026-11-21
    page: /notes/2026-11/
    title: Field notes, November 2026 (second correction)
    what: Our first correction said earlier open decision models such as Laya existed before Jev, and that every headline benchmark came from the makers. The radar note also kept prompt-injection defences at "emerging".
    now: Laya came out on 18 September 2026, three days after Jev, so Jev did come first. Independent tests of Jev exist (for example by Vals AI), with mixed results. Prompt-injection defences are in mainstream products, so they are now "shipping, not solved".
    found_by: fact-check
  - date: 2026-11-21
    page: /learn/around-the-model/
    title: 'Around the model: decision models'
    what: Listed Laya as a 2025 model by "Nandakishor M." that predated Jev, and said every headline number came from the makers.
    now: Laya is by Convai Innovations, released in September 2026, three days after Jev. The makers' numbers are self-reported, and the first independent tests are small and mixed. The imitation study is credited to AY Automate, which ran it.
    found_by: fact-check
  - date: 2026-11-21
    page: /radar/
    title: Frontier radar
    what: Prompt-injection defences, world models and interpretability tooling were placed one ring too far out, and the decision-models note said all benchmarks were self-reported.
    now: Prompt-injection defences are "shipping" (in products since 2024, still not solved); world models and interpretability tooling are "emerging" (public releases exist). The decision-models note mentions the first independent tests.
    found_by: fact-check
  - date: 2026-11-21
    page: /learn/strengths-and-limits/
    title: 'What they''re good at: context rot'
    what: Said Chroma's study found recall falls most with distractors that resemble the question, and that "lost in the middle" is much weaker in current models.
    now: Recall falls faster when the relevant passage resembles the question less closely. Current models show little position effect on simple retrieval tests, but it still appears in harder tasks.
    found_by: fact-check
  - date: 2026-11-21
    page: /learn/your-data/
    title: Where your words go
    what: "Gave Italy's \u20AC15 million fine against OpenAI without its outcome, said many local runtimes listen on all interfaces by default, and said chats with training switched off are kept about 30 days."
    now: A Rome court annulled the fine in March 2026 because the case belonged with the Irish regulator. Local runtimes usually bind to localhost; many guides and containers expose them. Switching off training deletes nothing; deleted chats leave back-end storage within about 30 days.
    found_by: fact-check
  - date: 2026-11-21
    page: /learn/supply-chain/
    title: 'Poisoned ingredients: the LiteLLM incident'
    what: Said the two published accounts disagreed on how the attacker got into LiteLLM.
    now: Both LiteLLM and Snyk trace it to a poisoned security scanner in CI that leaked the PyPI publishing token.
    found_by: fact-check
  - date: 2026-11-21
    page: /learn/beyond-autocomplete/
    title: Is it really just predicting the next word?
    what: Said one forward pass is about a hundred layers deep, and the agent-trace demo said constrained decoding always guarantees valid tool arguments.
    now: Depth is typically 30 to 120 layers. Valid arguments are guaranteed only with strict tool use switched on.
    found_by: fact-check
  - date: 2026-11-21
    page: /learn/attention/
    title: 'Attention: debate on full attention versus hybrids'
    what: Said MiniMax built a hybrid for its M2 model, and listed Sebastian Raschka as arguing for full attention.
    now: The hybrid was in MiniMax's earlier models; M2 went back to full attention. Raschka reported MiniMax's view rather than arguing for it, so he is no longer listed as a proponent.
    found_by: fact-check
  - date: 2026-11-21
    page: /learn/inside-the-stack/
    title: 'Inside the stack: Mixture of Experts'
    what: Said usually the top 2 to 8 experts run per token, and that an extra loss term always balances the router.
    now: Between 1 and 10 run, often next to a shared expert (Llama 4 Maverick uses 1, Qwen3.5 uses 10). DeepSeek-V3 balances with per-expert biases instead of a loss term.
    found_by: fact-check
  - date: 2026-11-21
    page: /learn/tokens/
    title: 'Text becomes tokens: how numbers are split'
    what: Said older tokenizers chunked numbers unevenly and many newer ones split them into single digits.
    now: 'It isn''t an old-versus-new split: GPT-4o and Llama 3 group up to three digits, while Llama 2 and Gemma use single digits.'
    found_by: fact-check
  - date: 2026-11-21
    page: /learn/prompt-injection/
    title: 'Debates in several chapters: attributions and wording'
    what: 'Several debate points misattributed or overstated sources: a spam-filter analogy credited to OpenAI and Anthropic, affiliations for the Kalai and Yue papers, the Hamburg paper''s argument, and Amodei''s 2027 interpretability line presented as a forecast.'
    now: 'Each point now says what the source says: OpenAI compares injection to scams, the affiliations include Georgia Tech and Shanghai Jiao Tong University, and Amodei''s 2027 line is a goal he set for Anthropic.'
    found_by: fact-check
  - date: 2026-11-21
    page: /notes/2026-11/
    title: Field notes, November 2026
    what: The notes called a Strands figure an independent benchmark run, presented Jev as the first decision model, and left out Cloudflare's Clef.
    now: The Strands figure is marked as self-reported, earlier open decision models such as Laya are named, and Clef is included.
    found_by: fact-check
