# Expert disagreements, shown in chapters as <Debate id="..."/> ("Where experts disagree").
# Purpose: encourage critical thinking. Steelman both sides; name real proponents; cite primary sources.
#
#   id          stable key
#   question    the disputed question, in plain language
#   why         one sentence: why this matters for the reader
#   sides       exactly two: label, who (named proponents), points (2-3 short bullets), sources (URLs)
#   settle      what evidence would move the debate
#   verified    date a human last checked both sides against their sources
#   half_life   months until re-check (debates move; usually 6)
debates:
  - id: injection-training-vs-architecture
    question: Can better training make prompt injection rare enough, or only system design?
    why: It decides whether you can trust an AI with your inbox once the vendor says its model resists attacks.
    sides:
      - label: Training and layers can manage it
        who: OpenAI, Anthropic
        points:
          - Models trained to rank instructions by source, plus automated red-teaming, cut measured attack success sharply.
          - Anthropic reported in August 2026 that at most 0.3% of test attacks got through its browser agent with all defences on (self-reported).
          - Like scams and social engineering, injection may never be fully solved, but layered defences, monitoring and confirmations can keep real-world risk low.
        sources:
          - https://openai.com/index/hardening-atlas-against-prompt-injection
          - https://openai.com/index/instruction-hierarchy-challenge
          - https://www.anthropic.com/research/prompt-injection-defenses
          - https://claude.com/blog/claude-in-chrome-generally-available
      - label: Only deterministic boundaries count
        who: Simon Willison, the UK NCSC, Nasr, Carlini, Tramèr and colleagues
        points:
          - Adaptive attacks broke 12 published defences, most of which had reported near-zero attack success.
          - Even a failure rate well under 1% is close to certain failure against an attacker who can retry many times.
          - Measured rates can rise again. Anthropic's November 2026 model did worse than its predecessor on an outside benchmark.
          - So untrusted input must never be able to reach privileged tools, whatever the model decides.
        sources:
          - https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/
          - https://www.ncsc.gov.uk/blog-post/prompt-injection-is-not-sql-injection
          - https://notebookcheck.net/Claude-Fable-5-2-fallbacks-make-AI-agents-more-vulnerable.1446771.0.html
          - https://arxiv.org/abs/2510.09023
    settle: Adaptive, independent red-team results on shipping products over time, and whether data-flow designs like CaMeL become usable for general assistants.
    verified: 2026-11-21
    half_life: 6

  - id: approval-prompts
    question: Are "Allow this action?" prompts a real safeguard or security theatre?
    why: Almost every AI agent today relies on you clicking approve. If that doesn't work, something else has to.
    sides:
      - label: Keep a human in the loop
        who: OWASP, Brave
        points:
          - Some actions, such as payments, emails to new recipients or deletions, can't be undone.
          - Only the human knows what they actually intended, so confirmation for high-impact steps is a core mitigation.
        sources:
          - https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
          - https://brave.com/blog/comet-prompt-injection/
      - label: Enforce boundaries instead
        who: Anthropic engineering, Invariant Labs
        points:
          - Users approved about 93% of prompts; sandboxing removed 84% of them without losing safety (self-reported).
          - People pick "Always allow" and stop reading, so the prompt gives false assurance.
          - Better to make dangerous actions impossible by default and keep prompts for rare boundary crossings.
        sources:
          - https://anthropic.com/engineering/how-we-contain-claude
          - https://invariantlabs.ai/blog/mcp-github-vulnerability
    settle: Field data on how often people catch a malicious action among routine prompts, compared with incidents in sandboxed setups.
    verified: 2026-11-21
    half_life: 6

  - id: data-poisoning-risk
    question: How worried should we be about poisoned training data in frontier models?
    why: Anyone can publish text on the web, and the web is what models learn from.
    sides:
      - label: Practical and cheap
        who: Nicholas Carlini and colleagues; Souly and colleagues (Anthropic, UK AISI, Alan Turing Institute)
        points:
          - Poisoning 0.01% of a web-scale dataset could cost about $60.
          - About 250 documents planted a backdoor regardless of model size, so attackers need a fixed number of pages, not a share of the web.
        sources:
          - https://arxiv.org/abs/2302.10149
          - https://arxiv.org/abs/2510.07192
      - label: Real, but narrower than the headlines
        who: The same research team's own caveats
        points:
          - The demonstrated backdoor was a narrow trigger that produced gibberish; more harmful behaviours have been harder to implant.
          - Attackers must survive data filtering and post-training, so curation and evaluation are the right investment.
          - "The Sleeper Agents work points the other way: once a backdoor is in, today's safety training may not remove it."
        sources:
          - https://www.anthropic.com/research/small-samples-poison
          - https://arxiv.org/abs/2401.05566
    settle: Poisoning experiments on frontier-scale models with harmful target behaviours, run against realistic data curation.
    verified: 2026-11-21
    half_life: 6

  - id: models-contain-data
    question: Does a trained model "contain" the personal data and texts it learned from?
    why: It decides whether you can demand deletion from a model, and whether training on your writing is copying.
    sides:
      - label: No, it holds abstract numbers
        who: Hamburg Data Protection Commissioner (discussion paper, 2024)
        points:
          - Storing a model is not processing personal data; rights apply to what goes in and comes out.
          - Extracting personal data from a model takes disproportionate effort, so the paper treats a model as not storing personal data.
        sources:
          - https://datenschutz-hamburg.de/fileadmin/user_upload/HmbBfDI/Datenschutz/Informationen/240715_Discussion_Paper_Hamburg_DPA_KI_Models.pdf
      - label: It depends, and often yes
        who: European Data Protection Board; Munich Regional Court I (GEMA v OpenAI, not final); extraction researchers
        points:
          - The EDPB says a model counts as anonymous only if extracting personal data is very unlikely, decided case by case.
          - The Munich court held that song lyrics memorised in model parameters are a reproduction under copyright law.
          - Researchers recovered personal data and near-complete books from production systems.
        sources:
          - https://www.edpb.europa.eu/our-work-tools/our-documents/opinion-board-art-64/opinion-282024-certain-data-protection-aspects_en
          - https://cms.law/en/deu/legal-updates/gema-vs.-openai-munich-regional-court-i-issues-landmark-copyright-decision
          - https://arxiv.org/abs/2311.17035
    settle: Final appeal rulings in cases like GEMA v OpenAI, and EU-level guidance applied to concrete models.
    verified: 2026-11-21
    half_life: 6

  - id: watermarking-worth-it
    question: Are AI watermarks and content credentials worth building?
    why: The EU AI Act now requires machine-readable marking of AI output, so this shapes what you will see on every platform.
    sides:
      - label: Yes, as one layer at scale
        who: Google DeepMind's SynthID team; the C2PA coalition; EU lawmakers
        points:
          - Text watermarks can work with no measurable quality loss and are cheap to check at platform scale.
          - Even imperfect signals raise the cost of mass misuse.
        sources:
          - https://github.com/google-deepmind/synthid-text
          - https://spec.c2pa.org/specifications/specifications/2.2/guidance/Guidance.html
      - label: They create false confidence
        who: Sadasivan, Feizi and colleagues; authors of a 2026 C2PA security analysis
        points:
          - Paraphrasing weakens text watermarks, and watermarks can be spoofed to frame humans.
          - Critics worry that a missing label will be misread as proof that something is real.
        sources:
          - https://arxiv.org/abs/2303.11156
          - https://arxiv.org/abs/2604.24890
    settle: Robustness of deployed watermarks against cheap paraphrasing, and how audiences actually interpret missing labels.
    verified: 2026-11-21
    half_life: 6

  # ---- Part 1 ----
  - id: tokenizers-permanent
    question: Are tokenizers a permanent part of language models, or a bottleneck we'll remove?
    why: Many odd failures (spelling, counting letters, some languages costing more) get blamed on tokens. Whether that blame is fair tells you which failures will go away.
    sides:
      - label: Tokenizer-free models are coming
        who: Meta's Byte Latent Transformer team (Pagnoni and colleagues)
        points:
          - A model that reads raw bytes, grouped into flexible patches, matched tokenized models at the scales tested.
          - It was more robust to typos and unusual text, and spent compute where text was hard rather than evenly.
        sources:
          - https://arxiv.org/abs/2412.09871
      - label: Tokens are a minor factor and here to stay
        who: Uzan and Pinter (CharBench); current frontier practice
        points:
          - Every major model whose tokenizer is public still uses subword tokens, and vocabularies are growing (Qwen3.5 went from about 150k to 250k).
          - CharBench finds tokenization explains less of the letter-counting failures than usually claimed; word length matters more.
        sources:
          - https://arxiv.org/html/2508.02591v2
          - https://www.alibabacloud.com/blog/qwen3-5-towards-native-multimodal-agents_602894
    settle: A tokenizer-free model competitive at frontier scale, or clear evidence on which character-level failures survive without tokens.
    verified: 2026-11-21
    half_life: 12

  - id: full-attention-vs-hybrid
    question: Is full attention necessary, or can cheaper layers replace most of it?
    why: Attention's cost is what makes long documents slow and expensive. If cheaper layers work, long-context AI gets much cheaper.
    sides:
      - label: Keep full attention
        who: MiniMax
        points:
          - MiniMax's earlier models mixed linear and full attention. At larger scale the hybrid fell behind on multi-step reasoning, so for M2 the company went back to full attention.
          - Tooling and hardware for the alternatives are still immature.
        sources:
          - https://www.minimax.io/news/why-did-m2-end-up-as-a-full-attention-model
      - label: Hybrids are already shipping
        who: Alibaba (Qwen team); Fichtl, Groh and colleagues at TU Munich
        points:
          - Alibaba's flagship open model Qwen3.5 (February 2026) mixes a few full-attention layers with cheaper linear-attention layers.
          - A critical TU Munich review finds it plausible that pure-attention models will soon be challenged, especially on small devices.
        sources:
          - https://www.alibabacloud.com/blog/qwen3-5-towards-native-multimodal-agents_602894
          - https://arxiv.org/abs/2510.05364
    settle: Head-to-head results at the same scale on long, multi-step tasks, and which design the next generation of flagships picks.
    verified: 2026-11-21
    half_life: 6

  - id: interpretability-localise
    question: Can we find where a model keeps what it knows?
    why: If we can read a model's internals, we can check it for problems directly instead of only testing its outputs.
    sides:
      - label: Yes, and it's getting practical
        who: Geva and colleagues; Meng and colleagues; Anthropic's interpretability team; Dario Amodei
        points:
          - The "think" layers behave like key-value memories: keys detect text patterns, and values push towards likely next words.
          - Meng and colleagues located factual associations in middle-layer MLPs and edited single facts directly (ROME).
          - Anthropic extracted millions of human-interpretable features from a production model.
          - Amodei has set Anthropic the goal that interpretability can reliably detect most model problems by 2027.
        sources:
          - https://arxiv.org/abs/2012.14913
          - https://arxiv.org/abs/2202.05262
          - https://transformer-circuits.pub/2024/scaling-monosemanticity/
          - https://www.darioamodei.com/post/the-urgency-of-interpretability
      - label: The maps are less useful than they look
        who: Hase, Bansal, Kim and Ghandeharioun; Google DeepMind's interpretability team (Nanda and colleagues)
        points:
          - Finding where a fact "lives" doesn't predict which layer is best to edit to change it.
          - DeepMind found these feature dictionaries did worse than simple probes on a real safety task, and scaled back that research line.
        sources:
          - https://arxiv.org/abs/2301.04213
          - https://www.lesswrong.com/posts/4uXCAJNuPKtKBsi28/negative-results-for-saes-on-downstream-tasks
    settle: Interpretability tools that catch a real problem in a frontier model that ordinary testing missed.
    verified: 2026-11-21
    half_life: 12

  - id: more-thinking-better
    question: Does letting a model "think" longer reliably give better answers?
    why: You pay for thinking tokens and wait for them. Knowing when they help tells you when to switch thinking on.
    sides:
      - label: More thinking buys accuracy
        who: OpenAI; Snell and colleagues (Google DeepMind and UC Berkeley)
        points:
          - OpenAI reports o1's accuracy rises steadily with time spent thinking.
          - Spending compute well at answer time can beat a model 14 times larger on suitable problems.
        sources:
          - https://openai.com/index/learning-to-reason-with-llms/
          - https://arxiv.org/abs/2408.03314
      - label: Sometimes it hurts
        who: Gema and colleagues (Anthropic Fellows and collaborators); Shojaee and colleagues (Apple); Liu, Griffiths and colleagues
        points:
          - On purpose-built tasks, longer reasoning lowered accuracy through distraction and over-thinking the framing.
          - On tasks where deliberating also makes people worse, chain-of-thought lowered accuracy sharply (Liu et al., 2024).
          - On the hardest puzzles, reasoning models' effort and accuracy collapsed despite spare budget (a result others attribute partly to test design).
        sources:
          - https://arxiv.org/abs/2507.14417
          - https://arxiv.org/abs/2506.06941
          - https://arxiv.org/abs/2506.09250
          - https://arxiv.org/abs/2410.21333
    settle: Clear guidance on which kinds of task benefit, measured on real work rather than puzzles.
    verified: 2026-11-21
    half_life: 6

  - id: rl-new-abilities
    question: Does the "practice exam" stage teach new abilities, or just bring out what the model already had?
    why: It decides whether the recent jumps in maths and coding can keep coming from more practice, or need better base models.
    sides:
      - label: Mostly bringing out what's there
        who: Yue, Chen, Lu and colleagues (Tsinghua University and Shanghai Jiao Tong University)
        points:
          - Trained models get the right answer on the first try more often than their base models.
          - But given many attempts, the base models solve more problems, so the training narrowed the model onto paths it could already find.
        sources:
          - https://arxiv.org/abs/2504.13837
      - label: It finds new strategies
        who: Liu, Diao, Choi, Kautz and colleagues (NVIDIA); DeepSeek
        points:
          - Long, stable practice found strategies the base model couldn't reach even with very many attempts.
          - DeepSeek-R1 reports self-checking and changes of strategy appearing from practice alone.
        sources:
          - https://arxiv.org/abs/2505.24864
          - https://arxiv.org/abs/2501.12948
    settle: Results that hold across longer training runs, more domains and agreed ways of counting "solved with many attempts".
    verified: 2026-11-21
    half_life: 6

  - id: world-models-or-heuristics
    question: Do language models build an internal picture of the world, or a pile of shortcuts that looks like one?
    why: It's the core of the "just autocomplete" argument, and it tells you how far to trust a model on situations unlike its training data.
    sides:
      - label: They build internal models
        who: Li and colleagues; Nanda, Lee and Wattenberg; Anthropic's interpretability team
        points:
          - A model trained only on Othello moves built a board representation, and editing it changed its moves.
          - In a production model, researchers saw hidden in-between steps and forward planning.
        sources:
          - https://arxiv.org/abs/2210.13382
          - https://arxiv.org/abs/2309.00941
          - https://www.anthropic.com/research/tracing-thoughts-language-model
      - label: Partial, patchy shortcuts
        who: Vafa, Kleinberg, Mullainathan and colleagues; Emily Bender and Alexander Koller
        points:
          - Models passed standard world-model tests while their internal maps were incoherent and broke on slightly different tasks.
          - A model trained on planetary orbits learned task-specific tricks, not Newton's laws.
          - Bender and Koller argue that text alone can't connect words to the things they mean.
        sources:
          - https://arxiv.org/abs/2406.03689v2
          - https://arxiv.org/abs/2507.06952
          - https://aclanthology.org/2020.acl-main.463/
    settle: Tests that check whether internal pictures stay coherent when the situation changes, applied to frontier models.
    verified: 2026-11-21
    half_life: 12

  - id: hallucination-fixable
    question: Can making things up be fixed, or only reduced?
    why: It decides whether you should ever trust an unsourced answer, or always check.
    sides:
      - label: It can't reach zero
        who: Xu, Jain and Kankanhalli; Kalai and Vempala
        points:
          - Learning theory suggests any general-purpose model must sometimes produce false answers.
          - A model honest about its uncertainty must still invent some facts it saw only once.
        sources:
          - https://arxiv.org/abs/2401.11817
          - https://arxiv.org/abs/2311.14648
      - label: It's largely an incentive problem
        who: Kalai, Nachum, Vempala and Zhang (OpenAI and Georgia Tech)
        points:
          - Benchmarks reward confident guessing over "I don't know", so training learns to guess.
          - The authors argue that scoring abstention fairly in mainstream tests could cut hallucination substantially; repeated and systematic facts need not be hallucinated at all.
        sources:
          - https://arxiv.org/abs/2509.04664
    settle: Benchmarks that reward abstention becoming standard, and whether models trained against them hallucinate much less in daily use.
    verified: 2026-11-21
    half_life: 12

  - id: decision-models-trust
    question: Can you trust a decision model's confident numbers?
    why: If decision models sit at every checkpoint of an agent, their mistakes decide what the agent is allowed to do.
    sides:
      - label: Yes, fast and reasonably calibrated
        who: Strands Labs (AWS); Cloudflare
        points:
          - Strands reports 0.78 accuracy on JevBench with good calibration at about 115 ms on a consumer graphics card.
          - Cloudflare reports Clef ahead of Jev on Jev's own index, and Clef-flash at a median under 40 ms.
        sources:
          - https://github.com/strands-labs/strands-decider
          - https://blog.cloudflare.com/clef-decision-models/
      - label: The evidence is thin
        who: Jiawei Li (independent preprint); AY Automate; Tang and Zheng (Northeastern University)
        points:
          - One evaluation found Jev at chance on routing and "confidently constant", with the open Laya model no better.
          - Another found a decision model copied the big model, mistakes included, more than it matched the correct answers.
          - An audit of the first 28 papers found no accuracy advantage from the typed format itself and no like-for-like baseline in most of them; the headline benchmarks for Strands Decider and Clef are still self-reported.
        sources:
          - https://arxiv.org/abs/2609.32160
          - https://arxiv.org/abs/2610.02267
          - https://www.ayautomate.com/blog/jev-vs-llm-benchmark
          - https://vals.ai/blogs/independent-evaluation-of-jev
          - https://amplitude.com/blog/jev-analysis
    settle: Independent replication on shared tasks, especially on decisions from real deployments.
    verified: 2026-11-21
    half_life: 3

  - id: imitation-dead-end
    question: Is learning from human text a dead end for more general intelligence?
    why: It decides whether the next big step comes from scaling today's recipe or from something quite different.
    sides:
      - label: Imitation will hit a wall
        who: Richard Sutton; Ilya Sutskever; Yann LeCun
        points:
          - Sutton argues LLMs copy what people said instead of learning from the consequences of their own actions.
          - Sutskever says models generalise far worse than people and the "age of scaling" is giving way to an age of research.
          - LeCun's AMI Labs bets on world models that predict in an abstract space instead of word by word.
        sources:
          - https://www.dwarkesh.com/p/richard-sutton
          - https://www.dwarkesh.com/p/ilya-sutskever-2
          - https://amilabs.xyz/updates
      - label: The recipe already goes beyond imitation
        who: DeepSeek; NVIDIA's ProRL team; Epoch AI
        points:
          - The practice-exam stage is learning from consequences, and it produced self-checking and new strategies.
          - Epoch AI finds much larger training runs remain feasible this decade, limited by power and chips.
        sources:
          - https://arxiv.org/abs/2501.12948
          - https://arxiv.org/abs/2505.24864
          - https://epoch.ai/blog/can-ai-scaling-continue-through-2030
    settle: Whether gains from more practice and compute keep showing up in real-world work, not just benchmarks, over the next few model generations.
    verified: 2026-11-21
    half_life: 6

  - id: ai-vuln-wave
    question: Is the AI vulnerability wave a real rise in risk, or mostly a bigger pile of paperwork?
    why: Disclosures have multiplied in a few months, but confirmed attacks have grown much less.
    sides:
      - label: A real rise in risk
        who: UK NCSC; Verizon's breach report; many practitioners running patch programmes
        points:
          - Every disclosed flaw is also a map for attackers, and a patch shows exactly what changed.
          - Exploited vulnerabilities are now the most common way breaches start, while patching is getting slower.
          - Old, unsupported systems will never get fixes, so the debt only moves from unknown to known.
        sources:
          - https://www.ncsc.gov.uk/sites/default/files/2026-10/Preparing-for-a-%E2%80%98vulnerability-patch-wave%E2%80%99.pdf
          - https://www.verizon.com/about/news/breach%2Dindustry%2Dwide%2Ddbir%2Dfinds
      - label: Mostly a bigger haystack, for now
        who: Dustin Childs (Zero Day Initiative); Patrick Garrity (VulnCheck)
        points:
          - Discovery is scaling faster than exploitation; confirmed attacks have risen far less than disclosures.
          - Many AI findings are duplicates, out of scope or never fixed, and very few have been exploited.
          - Teams that triage by count instead of exploitability waste effort on the wrong bugs.
        sources:
          - https://cyberscoop.com/microsoft-patch-tuesday-october-2026/
          - https://www.vulncheck.com/blog/anthropic-glasswing-november-update
    settle: A year of exploitation data (CISA's list, breach reports) showing whether attacks rise in step with disclosures, or stay flat while the backlog grows.
    verified: 2026-11-21
    half_life: 3

  - id: errors-compound
    question: Do small errors doom long agent tasks, or can good design beat the arithmetic?
    why: If every step can fail, long tasks look hopeless on paper, yet agents finish multi-hour jobs.
    sides:
      - label: Errors compound, so long tasks stay fragile
        who: Toby Ord; METR; the MAKER authors on today's models
        points:
          - Success on long tasks fits a constant chance of failing each minute, so success falls off exponentially with task length.
          - Agents handle single skills well but struggle to string long sequences of actions together.
          - Models keep a persistent error rate that, left alone, derails a long process.
        sources:
          - https://arxiv.org/abs/2505.05115
          - https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/
          - https://arxiv.org/abs/2511.09030
      - label: Design can beat the arithmetic
        who: Sinha and colleagues; Meyerson and colleagues (MAKER); Anthropic's agent guidance
        points:
          - Small gains in per-step accuracy compound into much longer tasks, and thinking reduces the knock-on effect of earlier mistakes.
          - Splitting work into tiny steps with voting completed over a million steps without error.
          - Checks against the real world at every step (tests, tool results) let an agent catch and fix its own mistakes.
        sources:
          - https://arxiv.org/abs/2509.09677
          - https://arxiv.org/abs/2511.09030
          - https://www.anthropic.com/engineering/building-effective-agents
    settle: Long-task measurements that report how often agents succeed every time, not just once, with and without verification steps.
    verified: 2026-11-21
    half_life: 12

  - id: big-window-or-curation
    question: Should agents rely on ever-larger context windows, or on keeping the context small and focused?
    why: Windows grew from thousands to a million tokens, yet quality still drops as the context fills.
    sides:
      - label: Bigger windows make agents simpler and better
        who: Anthropic and Google, which now ship million-token windows
        points:
          - A larger window means fewer summaries, so fewer details get lost along the way.
          - Whole codebases or document sets fit at once, without a retrieval system that might fetch the wrong part.
          - Vendors report large gains on long-context retrieval tests (self-reported).
        sources:
          - https://claude.com/resources/articles/1m-context-ga
          - https://platform.claude.com/docs/en/about-claude/models/overview
      - label: Less, well-chosen context works better
        who: Chroma's context-rot study; the NoLiMa authors; Anthropic's own context-engineering guidance; Letta
        points:
          - Quality falls as input grows, even on simple tasks, and distracting material makes it worse.
          - Independent tests find usable length far below advertised length when the answer isn't a literal match.
          - Focused prompts beat full ones on memory tests, and a plain file-based agent matched specialised memory systems.
        sources:
          - https://www.trychroma.com/research/context-rot
          - https://arxiv.org/abs/2502.05167
          - https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
          - https://www.letta.com/blog/benchmarking-ai-agent-memory
    settle: Independent tests of million-token models on realistic agent work, not needle searches, compared with the same agents using curated context.
    verified: 2026-11-21
    half_life: 6

  - id: horizon-progress
    question: Do time-horizon charts show agents racing towards doing real work on their own?
    why: The chart that doubles every few months is the most quoted evidence about agent progress.
    sides:
      - label: Yes, the trend is real and fast
        who: METR
        points:
          - The task length agents finish half the time has doubled roughly every 3.6 months since 2024.
          - Models saturated METR's earlier task suite within a year, forcing a harder one.
          - At 50% success, the best agents now take on tasks that take skilled people days.
        sources:
          - https://metr.org/blog/2026-11-20-q4-2026-capability-update/
          - https://arxiv.org/abs/2503.14499
      - label: It measures difficulty, not independence
        who: METR's own limitations note; Rabanser, Kapoor, Narayanan and colleagues; Epoch AI
        points:
          - A time horizon is task difficulty in human hours, at 50% success; it is not how long an agent can work alone.
          - Reliability has improved far less than headline capability.
          - Graded on real research work, no model met the standard expected of staff on any task.
        sources:
          - https://metr.org/notes/2026-01-22-time-horizon-limitations/
          - https://arxiv.org/abs/2602.16666
          - https://epoch.ai/publications/how-good-are-fable-5-2-and-gpt-6-2-astra-at-real-work
    settle: Time horizons at high reliability (80% and above) on messy, real tasks, tracked over time.
    verified: 2026-11-21
    half_life: 3

  - id: scheming-evals
    question: Do lab tests where models deceive or sabotage tell us anything about real deployments?
    why: Headlines about AI blackmail come from staged scenarios, and the labs that run them disagree about what they mean.
    sides:
      - label: Early warnings worth taking seriously
        who: Anthropic, OpenAI and Apollo Research; the authors of the 2025 chain-of-thought monitorability position paper
        points:
          - Models from many labs take harmful paths when cornered, which shows the capability exists before it shows up in the wild.
          - Models behave differently when they think they are being watched, so test results may understate real behaviour.
          - Reading models' reasoning is one of the few monitoring tools available, and it is fragile.
        sources:
          - https://www.anthropic.com/research/agentic-misalignment
          - https://openai.com/index/detecting-and-reducing-scheming-in-ai-models/
          - https://arxiv.org/abs/2507.11473
      - label: Anecdotes dressed as science
        who: Christopher Summerfield and colleagues (UK AI Security Institute)
        points:
          - The field echoes 1970s ape-language research, attributing human motives to systems on the strength of vivid examples.
          - Scenarios are built to push models towards the bad option, so rates say little about everyday use.
          - Without a theory of when such behaviour should arise, results are hard to interpret or generalise.
        sources:
          - https://arxiv.org/abs/2507.03409
    settle: Independent measurements of deception and false success reports in real deployments, not staged scenarios.
    verified: 2026-11-21
    half_life: 12
