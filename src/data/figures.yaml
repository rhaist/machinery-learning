    sources: [https://ai.meta.com/blog/meta-llama-3-1/, https://huggingface.co/NousResearch/Meta-Llama-3-70B/blob/main/config.json]
    evidence: "our latest models expand context length to 128K"
    verified: 2026-11-21
  - page: chapters/inside-the-stack
    text: "usually between 1 and 10 of them run"
