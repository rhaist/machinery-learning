# Specific numbers in chapter and field-note prose that are not <Claim>s.
# scripts/check-figures.mjs fails on any number without a home here or in claims.yaml.
# Bare years and days of dates are exempt. `names` lists names that contain digits.
#
# kind: source        a fact from a source: sources, evidence (short exact excerpt), verified
#       derived       our own calculation: calc, based_on (sources or other figures)
#       illustrative  a made-up example or toy value: note

names:
  - Part 1
  - Part 2
  - Part 3
  - Part 4
  - pass@1
  - pass^4
  - OSWorld 2.0
  - Llama 3 70B
  - 70B-class
  - Llama 3.1
  - Llama 2
  - Llama 3
  - Llama 4 Maverick
  - Claude 3.7 Sonnet
  - Claude 3.5 Haiku
  - Claude 3 Opus
  - Tülu 3
  - ARC-AGI-1
  - Strands Decider 2B
  - Apache 2.0
  - Top 10 for Agentic Applications
  - temperature 0
  - Article 50

figures:
  - page: notes/2026-11
    text: "Microsoft's October update alone fixed 1,413 flaws, more than in all of 2025"
    kind: source
    sources: [https://cyberscoop.com/microsoft-patch-tuesday-october-2026/, https://www.infosecurity-magazine.com/news/microsoft-patch-tuesday-record-1/]
    evidence: "a mega Patch Tuesday, containing 1,413 defects"
    verified: 2026-11-21
  - page: notes/2026-11
    text: "doubles about every 3.6 months"
    kind: source
    sources: [https://metr.org/blog/2026-11-20-q4-2026-capability-update/]
    evidence: "time horizons are doubling roughly every 3.61 months"
    verified: 2026-11-21
  - page: chapters/agents-at-work
    text: "At 50% success, the newest model in this data handles tasks of about seventeen hours. Demand four successes in five and the same model manages about three"
    kind: derived
    calc: "Claude Mythos Preview in METR's benchmark_results_1_1.yaml: p50 1044.8 min = 17.4 h; p80 185.9 min = 3.1 h."
    based_on: [https://metr.org/assets/benchmark_results_1_1.yaml]
  - page: chapters/agents-at-work
    text: "If a task must work 95% of the time"
    kind: illustrative
    note: "Example reliability requirement."
  - page: chapters/agents-at-work
    text: "Time-horizon charts at 50% won't tell you"
    kind: illustrative
    note: "Refers to METR's standard 50% success threshold, explained in the chapter."
  - page: chapters/agents-at-work
    text: "An agent's 50% time horizon is about seventeen hours"
    kind: illustrative
    note: "Quiz example, close to Claude Mythos Preview's 50% horizon in METR's data."
  - page: chapters/agent-loop
    text: "At 99% per step, a fifty-step task runs cleanly only about six times in ten"
    kind: derived
    calc: "0.99^50 = 0.605, about six in ten. Toy model with independent steps, as stated in the text."
    based_on: [illustrative per-step rate]
  # --- derived: our own calculations ---
  - page: chapters/tokens
    text: "200,000 tokens × 8,192 numbers is 1.6 billion parameters"
    kind: derived
    calc: "200,000 × 8,192 = 1,638,400,000 ≈ 1.6 billion"
    based_on: [vocab-size claim, Llama 3 70B hidden size]
  - page: chapters/attention
    text: "weights that add up to 1"
    kind: derived
    calc: "Softmax output sums to 1 by definition."
  - page: chapters/generating
    text: "A temperature below 1 stretches the gaps between scores, so the top choice dominates; above 1 it flattens them"
    kind: derived
    calc: "Softmax of logits divided by T: T < 1 scales differences up, T > 1 scales them down."
  - page: chapters/judging-claims
    text: "Out of 1,000 essays: 50 are AI, of which 45 are caught. 950 are human, of which 2%, about 19, are flagged. So about 19 of 64 flagged essays, roughly 30%, are innocent."
    kind: derived
    calc: "1,000 × 5% = 50 AI; 50 × 90% = 45 caught; 950 × 2% = 19 false alarms; 19 / (45 + 19) = 29.7%"
  # --- illustrative: made-up examples and quiz options ---
  - page: chapters/tokens
    text: "A number like 892 means nothing by itself"
    kind: illustrative
    note: "An arbitrary token ID."
  - page: chapters/tokens
    text: "(\"12345\" becomes \"123\" + \"45\" in GPT-4o's and Llama 3's)"
    kind: derived
    calc: "Encoded with tiktoken's o200k_base (GPT-4o): '12345' → '123' + '45'. Llama 3's tokenizer also groups digits in threes."
    based_on: [https://github.com/openai/tiktoken]
  - page: chapters/generating
    text: "\"connection\" 30%, \"request\" 22%, \"traffic\" 18%"
    kind: illustrative
    note: "Example probabilities, matching the hero demo."
  - page: chapters/generating
    text: "Generating token 500 doesn't recompute tokens 1 to 499"
    kind: illustrative
    note: "Any position works."
  - page: chapters/generating
    text: "You turn the temperature down to 0.1"
    kind: illustrative
    note: "Quiz scenario."
  - page: chapters/inside-the-stack
    text: "It runs 18 copies of the model in parallel"
    kind: illustrative
    note: "Wrong quiz option (671 / 37 ≈ 18)."
  - page: chapters/judging-claims
    text: "An AI detector catches 90% of AI essays and wrongly flags only 2% of human ones. In a class where 5% of essays are AI-written"
    kind: illustrative
    note: "Quiz scenario; the answer is derived below."
  - page: chapters/judging-claims
    text: "About 2% / About 10% / About 30% / About 90%"
    kind: illustrative
    note: "Quiz options."
  - page: chapters/generating
    text: "Why temperature 0 still varies"
    kind: illustrative
    note: "Heading; temperature 0 is the setting being discussed."
  # --- sources: chapters 1-5 (verified in the independent audit, 21 Nov 2026) ---
  - page: chapters/start-here
    text: "where the 70 billion parameters sit"
    kind: derived
    calc: "80 × (151M attention + 705M MLP) + 2 × 1.05B embedding tables = 70.55B"
    based_on: [https://huggingface.co/NousResearch/Meta-Llama-3-70B/blob/main/config.json]
  - page: chapters/start-here
    text: "one row of 8,192 numbers per token"
    kind: source
    sources: [https://huggingface.co/NousResearch/Meta-Llama-3-70B/blob/main/config.json]
    evidence: '"hidden_size": 8192'
    verified: 2026-11-21
  - page: chapters/tokens
    text: "In English, 1,000 tokens is roughly 750 words"
    kind: source
    sources: [https://help.openai.com/en/articles/4936856-what-are-tokens-and-how-to-count-them]
    evidence: "1 token ~= ¾ words"
    verified: 2026-11-21
  - page: chapters/tokens
    text: "The vocabulary starts with the 256 possible byte values"
    kind: derived
    calc: "A byte has 8 bits: 2^8 = 256 values."
  - page: chapters/tokens
    text: "4,000 to 16,000 numbers in large models, 1,000 to 3,000 in small ones"
    kind: source
    sources: [https://arxiv.org/abs/2407.21783, https://huggingface.co/unsloth/Llama-3.2-1B/blob/main/config.json]
    evidence: "Model dimension 4,096 | 8,192 | 16,384"
    verified: 2026-11-21
  - page: chapters/attention
    text: "Llama 3 70B has 64 query heads but only 8 key/value heads"
    kind: source
    sources: [https://huggingface.co/NousResearch/Meta-Llama-3-70B/blob/main/config.json]
    evidence: '"num_attention_heads": 64, "num_key_value_heads": 8'
    verified: 2026-11-21
  - page: chapters/attention
    text: "about 50,000 earlier tokens"
    kind: derived
    calc: "Per token, attention scores cost about 2·n·d·L FLOPs against about 2·P for the weights; with d = 8,192, L = 80, P = 70.6B they are equal near n ≈ 53,000."
    based_on: [https://huggingface.co/NousResearch/Meta-Llama-3-70B/blob/main/config.json]
  - page: chapters/inside-the-stack
    text: "30 to over 120 layers in today's large models"
    kind: source
    sources: [https://arxiv.org/abs/2407.21783]
    evidence: "Layers 32 | 80 | 126"
    verified: 2026-11-21
  - page: chapters/inside-the-stack
    text: "What \"70 billion parameters\" means"
    kind: illustrative
    note: "Heading; the example size used throughout."
  - page: chapters/inside-the-stack
    text: "\"A 70B model\" has 70 billion of them"
    kind: illustrative
    note: "Definition of the naming convention."
  - page: chapters/inside-the-stack
    text: "so only about 5% of the model works on any one word"
    kind: derived
    calc: "DeepSeek-V3: 37B / 671B = 5.5%; Qwen3.5: 17B / 397B = 4.3%"
    based_on: [https://arxiv.org/abs/2412.19437, https://huggingface.co/Qwen/Qwen3.5-397B-A17B]
  - page: chapters/inside-the-stack
    text: "about 80% in a dense model like Llama 3 70B"
    kind: derived
    calc: "MLP 80 × 705M = 56.4B of 70.55B = 79.9%"
    based_on: [https://huggingface.co/NousResearch/Meta-Llama-3-70B/blob/main/config.json]
  - page: chapters/inside-the-stack
    text: "A residual stream 8,192 numbers wide can hold far more than 8,192 concepts"
    kind: illustrative
    note: "Width from Llama 3 70B; the point is superposition."
  - page: chapters/inside-the-stack
    text: "| 70B parameters, 80 layers | 80 blocks of attention plus MLP | | Hidden size 8192 | The residual stream is 8,192 numbers wide | | 64 attention heads, 8 KV heads | 64 query heads share 8 sets of keys and values"
    kind: source
    sources: [https://huggingface.co/NousResearch/Meta-Llama-3-70B/blob/main/config.json]
    evidence: '"num_hidden_layers": 80, "hidden_size": 8192, "num_key_value_heads": 8'
    verified: 2026-11-21
  - page: chapters/inside-the-stack
    text: "| 128k context | The window, in tokens. Llama 3.1 introduced it; the first Llama 3 had 8k"
