frontier:
  - { title: "Beyond Standard LLMs", by: Sebastian Raschka, year: 2025, url: "https://magazine.sebastianraschka.com/i/177848019/24-qwen3-next", why: "A balanced tour of hybrids, diffusion models and recursive models.", beginner: true }
  - { title: "Why did M2 end up as a full-attention model?", by: MiniMax, year: 2025, url: "https://www.minimax.io/news/why-did-m2-end-up-as-a-full-attention-model", why: "A lab's own account of why it abandoned a hybrid." }
  - { title: "V-JEPA 2", by: Assran et al., year: 2025, url: "https://arxiv.org/abs/2506.09985", why: "The concrete JEPA world-model result: robot planning from video." }
