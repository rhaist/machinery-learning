# Further reading, shown at the end of each chapter. Prefer primary sources and a few beginner-friendly ones.
#   title, by, year, url, why (one line), beginner (true = no background needed)
start-here:
  - { title: "Intro to Large Language Models (1-hour talk)", by: Andrej Karpathy, year: 2023, url: "https://www.youtube.com/watch?v=zjkBMFhNj_g", why: "A one-hour non-technical overview of the whole pipeline.", beginner: true }
  - { title: "Large Language Models explained briefly", by: 3Blue1Brown, year: 2024, url: "https://www.youtube.com/watch?v=LPZh9BOjkQs", why: "An eight-minute visual version of this chapter.", beginner: true }
  - { title: "Deep Dive into LLMs like ChatGPT", by: Andrej Karpathy, year: 2025, url: "https://www.youtube.com/watch?v=7xTGNNLPyMI", why: "Long, but covers pretraining, fine-tuning, RL and hallucination in plain terms.", beginner: true }
  - { title: "Climbing towards NLU: on meaning, form and understanding", by: "Bender, Koller", year: 2020, url: "https://aclanthology.org/2020.acl-main.463/", why: "The classic sceptical argument that form alone can't give meaning." }
tokens:
  - { title: "Let's build the GPT Tokenizer", by: Andrej Karpathy, year: 2024, url: "https://www.youtube.com/watch?v=zduSFxRajkE", why: "Builds a BPE tokenizer from scratch, quirks included." }
  - { title: "Byte-Pair Encoding tokenization", by: Hugging Face LLM Course, url: "https://huggingface.co/learn/llm-course/chapter6/5", why: "A short worked example of how a tokenizer is trained.", beginner: true }
  - { title: "Neural Machine Translation of Rare Words with Subword Units", by: "Sennrich, Haddow, Birch", year: 2016, url: "https://arxiv.org/abs/1508.07909", why: "The paper that brought BPE to language processing." }
  - { title: "CharBench: the role of tokenization in character-level tasks", by: "Uzan, Pinter", year: 2025, url: "https://arxiv.org/html/2508.02591v2", why: "Current evidence on how much tokens explain the strawberry failures." }
attention:
  - { title: "Attention in transformers, step by step", by: 3Blue1Brown, year: 2024, url: "https://www.youtube.com/watch?v=eMlx5fFNoYc", why: "A visual explanation of query, key and value.", beginner: true }
  - { title: "The Illustrated Transformer", by: Jay Alammar, year: 2018, url: "https://jalammar.github.io/illustrated-transformer/", why: "A diagram-led walkthrough of the whole architecture.", beginner: true }
  - { title: "Attention Is All You Need", by: Vaswani et al., year: 2017, url: "https://arxiv.org/abs/1706.03762", why: "The transformer paper." }
  - { title: "In-context Learning and Induction Heads", by: Olsson et al. (Anthropic), year: 2022, url: "https://transformer-circuits.pub/2022/in-context-learning-and-induction-heads/index.html", why: "Primary source on induction heads, including its own caveats." }
inside-the-stack:
  - { title: "How might LLMs store facts", by: 3Blue1Brown, year: 2024, url: "https://www.youtube.com/watch?v=9-Jl0dxWQs8", why: "A visual account of the MLP as a knowledge store.", beginner: true }
  - { title: "Transformer Feed-Forward Layers Are Key-Value Memories", by: Geva et al., year: 2021, url: "https://arxiv.org/abs/2012.14913", why: "Primary evidence for knowledge living in the MLP." }
  - { title: "Scaling Monosemanticity", by: Templeton et al. (Anthropic), year: 2024, url: "https://transformer-circuits.pub/2024/scaling-monosemanticity/", why: "Millions of interpretable features from a production model; the introduction is readable." }
  - { title: "DeepSeek-V3 Technical Report", by: DeepSeek-AI, year: 2024, url: "https://arxiv.org/abs/2412.19437", why: "A fully documented modern Mixture of Experts." }
generating:
  - { title: "Defeating Nondeterminism in LLM Inference", by: Horace He (Thinking Machines Lab), year: 2025, url: "https://thinkingmachines.ai/blog/defeating-nondeterminism-in-llm-inference/", why: "Why temperature 0 still varies, and how to fix it, written for non-specialists." }
  - { title: "The Curious Case of Neural Text Degeneration", by: Holtzman et al., year: 2019, url: "https://arxiv.org/abs/1904.09751", why: "Introduces top-p sampling." }
  - { title: "Fast Inference from Transformers via Speculative Decoding", by: "Leviathan, Kalman, Matias", year: 2022, url: "https://arxiv.org/abs/2211.17192", why: "Draft-and-verify decoding." }
  - { title: "Scaling LLM Test-Time Compute Optimally", by: Snell et al., year: 2024, url: "https://arxiv.org/abs/2408.03314", why: "Primary evidence on thinking longer versus a bigger model." }
training:
  - { title: "Training language models to follow instructions with human feedback", by: Ouyang et al. (OpenAI), year: 2022, url: "https://arxiv.org/abs/2203.02155", why: "The canonical fine-tuning plus RLHF recipe." }
  - { title: "DeepSeek-R1", by: DeepSeek-AI, year: 2025, url: "https://arxiv.org/abs/2501.12948", why: "The open, documented recipe for reasoning through RL." }
  - { title: "Tülu 3: open post-training", by: Lambert et al. (Ai2), year: 2024, url: "https://arxiv.org/abs/2411.15124", why: "Defines RLVR, with a fully open post-training pipeline." }
  - { title: "Why We Think", by: Lilian Weng, year: 2025, url: "https://lilianweng.github.io/posts/2025-05-01-thinking/", why: "A careful survey of test-time compute, RL for reasoning and faithfulness." }
beyond-autocomplete:
  - { title: "Tracing the thoughts of a large language model", by: Anthropic, year: 2025, url: "https://www.anthropic.com/research/tracing-thoughts-language-model", why: "An accessible look inside a model.", beginner: true }
  - { title: "Evaluating the World Model Implicit in a Generative Model", by: Vafa et al., year: 2024, url: "https://arxiv.org/abs/2406.03689v2", why: "Shows models passing world-model tests with incoherent internal maps." }
  - { title: "Reasoning models don't always say what they think", by: Anthropic, year: 2025, url: "https://www.anthropic.com/research/reasoning-models-dont-say-think", why: "Evidence that written reasoning isn't a faithful transcript.", beginner: true }
  - { title: "Building effective agents", by: Anthropic, year: 2024, url: "https://www.anthropic.com/engineering/building-effective-agents", why: "A practical companion to the tool-loop section.", beginner: true }
strengths-and-limits:
