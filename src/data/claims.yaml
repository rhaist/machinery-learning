# Claims registry: every fact in the guide that can go stale lives here.
#
#   id         stable key, used as <Claim id="..."/> in chapters
#   text       what readers see (inline HTML allowed)
#   sources    URLs that back the claim (at least one for anything time-sensitive)
#   verified   date a human last confirmed the claim against its sources
#   half_life  months until the claim should be re-checked; omit for evergreen facts
#   status     research | emerging | shipping | faded | evergreen
#
# The site fades a claim once it is past its half-life, and scripts/check-claims.mjs
# lists everything overdue. The monthly update re-verifies or rewrites these first.

